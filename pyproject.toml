[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msk-warp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "warp-lang==1.14.0",
    "mujoco==3.10.0",
    "mujoco-warp",
    "tensorboardX",
    "pyyaml",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["msk_warp*"]

[tool.setuptools.package-data]
msk_warp = ["assets/*.xml", "configs/*.yaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: CPU-only, runs on every commit (tests/unit)",
    "gpu: needs CUDA; skipped without it or with MSK_SKIP_GPU=1 (tests/gpu)",
    "slow: training regressions; run with --run-slow (tests/slow)",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
mujoco-warp = { path = "C:/Projects/mujoco_warp_pr1423", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
