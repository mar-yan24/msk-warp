# Muscle hopper with a velocity-dominant reward. This is pre-declared response 3 from
# docs/research/phase3-hopper/protocol.md, triggered because G3.1 measured a 0% fall rate for the
# muscle hopper at every nonzero activation level: co-activating an antagonist pair stiffens each
# joint into a rigid strut, and the hopper stands statically on its foot indefinitely.
#
# height_rew_scale 0.0 removes the standing bonus and angle_rew_scale 0.25 shrinks the upright
# bonus, so standing earns about 0.1 per step against 1.25 per step for hopping at 1 m/s, a 12x
# ratio in favour of moving. Only the positive branch of the height term is scaled, so falling is
# still punished by the quadratic below the termination height. hopper_muscle_shac.yaml keeps
# DiffRL's reward and runs as the control, so the effect of this change is measured rather than
# assumed.
params:
  general:
    seed: 0
    device: cuda:0
    logdir: logs/hopper_muscle_shac_vel

  env:
    name: HopperMuscle
    model_path: assets/hopper_muscle.xml
    num_actors: 512
    episode_length: 1000
    stochastic_init: true
    substeps: 4
    action_strength: 1.0
    height_rew_scale: 0.0
    angle_rew_scale: 0.25
    early_termination: true
    backward_mode: tape_per_substep

  network:
    actor: ActorStochasticMLP
    actor_mlp:
      units: [128, 64, 32]
      activation: elu
    critic: CriticMLP
    critic_mlp:
      units: [64, 64]
      activation: elu

  config:
    name: hopper_muscle_shac_vel
    gamma: 0.99
    steps_num: 32
    max_epochs: 1000
    actor_learning_rate: 2e-3
    critic_learning_rate: 2e-4
    lr_schedule: linear
    betas: [0.7, 0.95]
    target_critic_alpha: 0.2
    obs_rms: true
    ret_rms: false
    critic_iterations: 16
    critic_method: td-lambda
    lambda: 0.95
    num_batch: 4
    num_actors: 512
    truncate_grads: true
    grad_norm: 1.0
    state_bptt: true
    state_grad_clip: 0.0
    state_grad_decay: 0.0
    save_interval: 100
    eval_interval: 50
    eval_episodes: 16
