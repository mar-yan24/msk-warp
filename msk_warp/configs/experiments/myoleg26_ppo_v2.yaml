# v2 PPO arm configuration for myoleg26-walk-v1. NOT a trained or tuned recipe.
#
# Identical to msk_warp/configs/experiments/myoleg26_ppo.yaml (the v1 baseline)
# except for three deliberate, declared changes:
#
#   config.name        myoleg26_ppo -> myoleg26_ppo_v2   (separate run identity)
#   config.max_epochs  500 -> 384                        (the largest sealed
#                                                         stage-3 epoch cap; the
#                                                         campaign driver supplies
#                                                         each stage's own cap)
#   general.logdir     logs/myoleg26_ppo -> logs/myoleg26_ppo_v2
#
# Every other hyperparameter stays at its v1 value, and the model, task, reward,
# reset distribution, 1.0 m/s target and evaluation horizon are unchanged.
#
# The four sealed recipes vary ONLY gamma and entropy_coef, and the campaign
# driver overrides exactly those two keys per arm. The gamma/entropy_coef values
# below are the v1 pair, which coincides with recipe g990_e010; they are a
# default, not a ranking or a preference between arms. The sealed numbers live in
# msk_warp/analysis/ppo_v2_protocol.py and are asserted against this file by
# tests/unit/test_myoleg26_ppo_v2_protocol.py.
#
# This file does not authorize training. It grants no budget, promotes no recipe
# and establishes no gate. It is NOT part of the frozen v1 experiment and must
# never be presented as the measured v1 implementation.
params:
  general:
    seed: 0
    device: cuda:0
    logdir: logs/myoleg26_ppo_v2
  env:
    name: MyoLeg26Walk
    model_path: assets/myoleg26/flat_boxes.xml
    model_contract: official
    num_actors: 64
    episode_length: 500
    stochastic_init: true
    substeps: 4
    action_strength: 1.0
    early_termination: true
    njmax: 1000
  network:
    actor: ActorStochasticMLP
    actor_logstd_init: -1.0
    actor_mlp:
      units: [128, 64]
      activation: elu
    critic: CriticMLP
    critic_mlp:
      units: [128, 64]
      activation: elu
  config:
    algorithm: ppo
    name: myoleg26_ppo_v2
    gamma: 0.99
    gae_lambda: 0.95
    steps_num: 128
    max_epochs: 384
    actor_learning_rate: 3e-4
    critic_learning_rate: 3e-4
    lr_schedule: constant
    betas: [0.9, 0.999]
    obs_rms: true
    ret_rms: false
    ppo_epochs: 5
    num_minibatches: 8
    clip_range: 0.2
    entropy_coef: 0.01
    truncate_grads: true
    max_grad_norm: 0.5
    save_interval: 50
