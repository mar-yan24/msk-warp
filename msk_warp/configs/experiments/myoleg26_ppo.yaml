# Forward-policy feasibility baseline for myoleg26-walk-v1; not a trained recipe.
# Reproduce the source/model/task hashes with scripts/check_myoleg26_task.py first.
# SHAC comparison is gated on actual free-root/tendon derivative validation.
params:
  general:
    seed: 0
    device: cuda:0
    logdir: logs/myoleg26_ppo
  env:
    name: MyoLeg26Walk
    model_path: assets/myoleg26/flat_boxes.xml
    model_contract: official
    num_actors: 64
    episode_length: 500
    stochastic_init: true
    substeps: 4
    action_strength: 1.0
    early_termination: true
    njmax: 1000
  network:
    actor: ActorStochasticMLP
    actor_logstd_init: -1.0
    actor_mlp:
      units: [128, 64]
      activation: elu
    critic: CriticMLP
    critic_mlp:
      units: [128, 64]
      activation: elu
  config:
    algorithm: ppo
    name: myoleg26_ppo
    gamma: 0.99
    gae_lambda: 0.95
    steps_num: 128
    max_epochs: 500
    actor_learning_rate: 3e-4
    critic_learning_rate: 3e-4
    lr_schedule: constant
    betas: [0.9, 0.999]
    obs_rms: true
    ret_rms: false
    ppo_epochs: 5
    num_minibatches: 8
    clip_range: 0.2
    entropy_coef: 0.01
    truncate_grads: true
    max_grad_norm: 0.5
    save_interval: 50
