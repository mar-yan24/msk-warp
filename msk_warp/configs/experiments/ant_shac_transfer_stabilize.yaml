# SHAC transfer stage 1 for PPO-bootstrapped Ant locomotion (short horizon,
# canonical reward). The bootstrap_reg anchor and the reward/reset curricula
# that this stage used in May 2026 were removed: every nonzero anchor
# coefficient regressed the gait (docs/POSTMORTEM.md, ledger #45).
params:
  general:
    seed: 42
    device: cuda:0
    logdir: logs/ant_shac_transfer_stabilize
    init_policy: null

  env:
    name: Ant
    model_path: assets/ant_soft.xml
    num_actors: 64
    episode_length: 1000
    stochastic_init: true
    substeps: 4
    action_strength: 1.0
    early_termination: true
    backward_mode: tape_per_substep
    forward_vel_weight: 1.0
    heading_weight: 1.0
    up_weight: 0.1
    height_weight: 1.0

  network:
    actor: ActorStochasticMLP
    actor_mlp:
      units: [128, 64, 32]
      activation: elu
    critic: CriticMLP
    critic_mlp:
      units: [64, 64]
      activation: elu

  config:
    name: ant_shac_transfer_stabilize
    gamma: 0.99
    steps_num: 8
    max_epochs: 100
    actor_learning_rate: 1e-3
    critic_learning_rate: 2e-3
    lr_schedule: constant
    betas: [0.7, 0.95]
    target_critic_alpha: 0.2
    obs_rms: true
    ret_rms: false
    critic_iterations: 16
    critic_method: td-lambda
    lambda: 0.95
    num_batch: 4
    num_actors: 64
    truncate_grads: true
    grad_norm: 20.0
    actor_grad_norm: 20.0
    critic_grad_norm: 20.0
    state_bptt: true
    state_grad_clip: 2.0
    state_grad_decay: 0.85
    save_interval: 25
