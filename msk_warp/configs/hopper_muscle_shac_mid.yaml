# Muscle hopper with a repaired velocity-dominant reward. Amendment A1 in
# docs/research/phase3-hopper/protocol.md, pre-registered after G3.5 failed 0 of 3 seeds with two
# seeds ending in the standing basin.
#
# hopper_muscle_shac_vel.yaml removed the height bonus entirely, which put diving on a par with
# standing (66 steps at 1.42 m/s pays 94, standing a full episode pays 100) and the policy dived.
# Keeping part of the bonus orders the outcomes correctly for the first time: per 1000-step
# episode, hopping at 1 m/s pays 1425, standing 425 and diving 122. The quadratic penalty below the
# termination height is not scaled, so falling is punished as before.
params:
  general:
    seed: 0
    device: cuda:0
    logdir: logs/hopper_muscle_shac_mid

  env:
    name: HopperMuscle
    model_path: assets/hopper_muscle.xml
    num_actors: 512
    episode_length: 1000
    stochastic_init: true
    substeps: 4
    action_strength: 1.0
    height_rew_scale: 0.3
    angle_rew_scale: 0.5
    early_termination: true
    backward_mode: tape_per_substep

  network:
    actor: ActorStochasticMLP
    actor_mlp:
      units: [128, 64, 32]
      activation: elu
    critic: CriticMLP
    critic_mlp:
      units: [64, 64]
      activation: elu

  config:
    name: hopper_muscle_shac_mid
    gamma: 0.99
    steps_num: 32
    max_epochs: 1000
    actor_learning_rate: 2e-3
    critic_learning_rate: 2e-4
    lr_schedule: linear
    betas: [0.7, 0.95]
    target_critic_alpha: 0.2
    obs_rms: true
    ret_rms: false
    critic_iterations: 16
    critic_method: td-lambda
    lambda: 0.95
    num_batch: 4
    num_actors: 512
    truncate_grads: true
    grad_norm: 1.0
    state_bptt: true
    state_grad_clip: 0.0
    state_grad_decay: 0.0
    save_interval: 100
    eval_interval: 50
    eval_episodes: 16
