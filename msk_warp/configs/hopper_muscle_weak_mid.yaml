# 35% peak force AND the repaired reward. Amendment A6, the response A5 pre-declared for a
# standing outcome.
#
# A5 stage 1 removed the standing basin from the physics: at this strength uniform co-activation
# falls in 100% of worlds. A5 stage 2 then learned to stand anyway, because DiffRL's reward still
# pays about 1110 per episode for it. A1's reward drops that to about 425 while leaving the fall
# penalty intact. A1 was only ever tested on a muscle strong enough to stand passively.
params:
  general:
    seed: 0
    device: cuda:0
    logdir: logs/hopper_muscle_weak_mid

  env:
    name: HopperMuscle
    model_path: assets/hopper_muscle_weak.xml
    num_actors: 512
    episode_length: 1000
    stochastic_init: true
    substeps: 4
    action_strength: 1.0
    height_rew_scale: 0.3
    angle_rew_scale: 0.5
    early_termination: true
    backward_mode: tape_per_substep

  network:
    actor: ActorStochasticMLP
    actor_mlp:
      units: [128, 64, 32]
      activation: elu
    critic: CriticMLP
    critic_mlp:
      units: [64, 64]
      activation: elu

  config:
    name: hopper_muscle_weak_mid
    gamma: 0.99
    steps_num: 32
    max_epochs: 1000
    actor_learning_rate: 2e-3
    critic_learning_rate: 2e-4
    lr_schedule: linear
    betas: [0.7, 0.95]
    target_critic_alpha: 0.2
    obs_rms: true
    ret_rms: false
    critic_iterations: 16
    critic_method: td-lambda
    lambda: 0.95
    num_batch: 4
    num_actors: 512
    truncate_grads: true
    grad_norm: 1.0
    state_bptt: true
    state_grad_clip: 0.0
    state_grad_decay: 0.0
    save_interval: 100
    eval_interval: 50
    eval_episodes: 16
