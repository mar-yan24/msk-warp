# Finite-difference control for the motor hopper gate. Identical to hopper_motor_shac.yaml apart
# from backward_mode, which replaces the taped adjoint with batched central differences, and
# num_actors, reduced because each FD gradient costs 2*nu extra forward worlds.
#
# The comparison is pre-registered in docs/research/phase3-hopper/protocol.md: AD failing while FD
# passes indicts the bridge or the backend; both failing indicts the task, the physics or
# exploration, not the adjoint.
params:
  general:
    seed: 0
    device: cuda:0
    logdir: logs/hopper_motor_shac_fd

  env:
    name: HopperMotor
    model_path: assets/hopper_motor.xml
    num_actors: 128
    episode_length: 1000
    stochastic_init: true
    substeps: 4
    action_strength: 1.0
    early_termination: true
    backward_mode: fd

  network:
    actor: ActorStochasticMLP
    actor_mlp:
      units: [128, 64, 32]
      activation: elu
    critic: CriticMLP
    critic_mlp:
      units: [64, 64]
      activation: elu

  config:
    name: hopper_motor_shac_fd
    gamma: 0.99
    steps_num: 32
    max_epochs: 500
    actor_learning_rate: 2e-3
    critic_learning_rate: 2e-4
    lr_schedule: linear
    betas: [0.7, 0.95]
    target_critic_alpha: 0.2
    obs_rms: true
    ret_rms: false
    critic_iterations: 16
    critic_method: td-lambda
    lambda: 0.95
    num_batch: 4
    num_actors: 128
    truncate_grads: true
    grad_norm: 1.0
    state_bptt: true
    state_grad_clip: 0.0
    state_grad_decay: 0.0
    save_interval: 100
    eval_interval: 50
    eval_episodes: 16
